services:
  chatwoot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      SECRET_KEY_BASE: $SERVICE_PASSWORD_CHATWOOT
      FRONTEND_URL: '${SERVICE_URL_CHATWOOT}'
      DEFAULT_LOCALE: '${CHATWOOT_DEFAULT_LOCALE:-en}'
      FORCE_SSL: 'false'
      ENABLE_ACCOUNT_SIGNUP: 'false'
      REDIS_URL: 'redis://default@redis:6379'
      REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
      REDIS_OPENSSL_VERIFY_MODE: none
      POSTGRES_DATABASE: chatwoot
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: $SERVICE_USER_POSTGRES
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      RAILS_MAX_THREADS: '5'
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      ACTIVE_STORAGE_SERVICE: local
      MAILER_SENDER_EMAIL: '${CHATWOOT_MAILER_SENDER_EMAIL}'
      SMTP_ADDRESS: '${CHATWOOT_SMTP_ADDRESS}'
      SMTP_AUTHENTICATION: '${CHATWOOT_SMTP_AUTHENTICATION}'
      SMTP_DOMAIN: '${CHATWOOT_SMTP_DOMAIN}'
      SMTP_ENABLE_STARTTLS_AUTO: '${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}'
      SMTP_PORT: '${CHATWOOT_SMTP_PORT}'
      SMTP_USERNAME: '${CHATWOOT_SMTP_USERNAME}'
      SMTP_PASSWORD: '${CHATWOOT_SMTP_PASSWORD}'
    entrypoint: docker/entrypoints/rails.sh
    command: ['sh', '-c', 'bundle exec rails db:chatwoot_prepare && bundle exec rails s -p 3000 -b 0.0.0.0']
    volumes:
      - rails-data:/app/storage
    healthcheck:
      # Relajado de 5s a 20s (2026-07-22) — a 5s competía por threads de
      # Puma con tráfico real (RAILS_MAX_THREADS=5, un solo proceso). Ver
      # docs/gotchas.md #7 en pixolab-server para el detalle completo.
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3000']
      interval: 20s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  sidekiq:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - postgres
      - redis
    environment:
      SECRET_KEY_BASE: $SERVICE_PASSWORD_CHATWOOT
      FRONTEND_URL: '${SERVICE_URL_CHATWOOT}'
      DEFAULT_LOCALE: '${CHATWOOT_DEFAULT_LOCALE:-en}'
      FORCE_SSL: 'false'
      ENABLE_ACCOUNT_SIGNUP: 'false'
      REDIS_URL: 'redis://default@redis:6379'
      REDIS_PASSWORD: $SERVICE_PASSWORD_REDIS
      REDIS_OPENSSL_VERIFY_MODE: none
      POSTGRES_DATABASE: chatwoot
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: $SERVICE_USER_POSTGRES
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      RAILS_MAX_THREADS: '5'
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      ACTIVE_STORAGE_SERVICE: local
      MAILER_SENDER_EMAIL: '${CHATWOOT_MAILER_SENDER_EMAIL}'
      SMTP_ADDRESS: '${CHATWOOT_SMTP_ADDRESS}'
      SMTP_AUTHENTICATION: '${CHATWOOT_SMTP_AUTHENTICATION}'
      SMTP_DOMAIN: '${CHATWOOT_SMTP_DOMAIN}'
      SMTP_ENABLE_STARTTLS_AUTO: '${CHATWOOT_SMTP_ENABLE_STARTTLS_AUTO}'
      SMTP_PORT: '${CHATWOOT_SMTP_PORT}'
      SMTP_USERNAME: '${CHATWOOT_SMTP_USERNAME}'
      SMTP_PASSWORD: '${CHATWOOT_SMTP_PASSWORD}'
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - rails-data:/app/storage
    healthcheck:
      # `bundle exec rails runner ...` bootea todo Rails en cada check
      # (~21.6s medido, contra un timeout de 10s) — siempre fallaba, marcaba
      # el contenedor "unhealthy" aunque Sidekiq funcionara bien, y gastaba
      # un boot completo de Rails cada 30s. Cambiado 2026-07-22 (revertido
      # sin querer en un merge de upstream, reaplicado 2026-08-30 — esta
      # vez commiteado en el repo para que sobreviva un redeploy). Ver
      # docs/gotchas.md #7 en pixolab-server.
      test: ['CMD-SHELL', 'pgrep -f sidekiq || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: $SERVICE_USER_POSTGRES
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $SERVICE_USER_POSTGRES -d chatwoot -h 127.0.0.1']
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    command: ['sh', '-c', 'redis-server --requirepass "$SERVICE_PASSWORD_REDIS"']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '$SERVICE_PASSWORD_REDIS', 'PING']
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  rails-data:
  postgres-data:
  redis-data:
